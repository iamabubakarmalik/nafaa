<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: dark)" />

    <!-- SEO -->
    <title>Nafaa Bazaar — Pakistan's #1 Marketplace | Fast Delivery</title>
    <meta name="description" content="Shop from thousands of trusted shops in your city. Fast delivery, best prices, bargain feature, and multiple payment options. Pakistan's most complete marketplace." />
    <meta name="keywords" content="Nafaa Bazaar, Pakistan marketplace, online shopping Pakistan, fast delivery, nearby shops, best prices, bargain shopping" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nafaa.pk" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nafaa Bazaar" />
    <meta property="og:title" content="Nafaa Bazaar — Pakistan's #1 Marketplace" />
    <meta property="og:description" content="Shop from thousands of trusted shops. Fast delivery, best prices, bargain feature." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://nafaa.pk" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:locale:alternate" content="ur_PK" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nafaa Bazaar — Pakistan's #1 Marketplace" />
    <meta name="twitter:description" content="Shop from thousands of trusted shops. Fast delivery, best prices." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nafaa" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Nafaa Bazaar",
        "url": "https://nafaa.pk",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://nafaa.pk/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
