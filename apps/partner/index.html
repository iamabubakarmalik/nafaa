<!doctype html>
<html lang="ur-Latn">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nafaa Partner" />

    <title>Nafaa Partner</title>
    <meta name="description" content="Nafaa partners ke liye: visits, leads, commission aur payout." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" data-ds-font="inter" />

    <!--
      Theme boot: applies the last saved appearance before the app loads, so a
      dark-mode user never sees a white flash. Values are written by
      apps/web/src/design-system/theme/apply.ts (key: nafaa-appearance-boot).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var cache = JSON.parse(localStorage.getItem('nafaa-appearance-boot') || 'null');
          if (cache) {
            if (cache.dark) root.classList.add('dark');
            root.style.colorScheme = cache.dark ? 'dark' : 'light';
            for (var name in cache.vars) root.style.setProperty(name, cache.vars[name]);
            if (cache.rootFontSize) root.style.fontSize = cache.rootFontSize;
            if (cache.density) root.dataset.density = cache.density;
            if (cache.radius) root.dataset.radius = cache.radius;
            return;
          }
        } catch (e) {}
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          root.classList.add('dark');
          root.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
